name: readme stats

# Regenerates assets/readme/streak.svg + contrib.svg from GitHub's own API,
# so the profile README doesn't depend on third-party stat services.
on:
  schedule:
    - cron: "17 */6 * * *" # every 6 hours
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - tools/stats_svg.py
      - .github/workflows/readme-stats.yml

permissions:
  contents: write

concurrency:
  group: readme-stats
  cancel-in-progress: true

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: generate svgs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/stats_svg.py Ahmadhussain0033
      - name: commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/readme/streak.svg assets/readme/contrib.svg
          git diff --cached --quiet && echo "no changes" && exit 0
          git commit -m "chore: refresh README stats"
          git push
